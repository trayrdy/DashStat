[platformio]
default_envs = esp32-cyd

[env:esp32-cyd]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
upload_speed = 921600
monitor_speed = 115200

build_flags = 
    -O3
    -std=gnu++17
    -DLV_CONF_INCLUDE_SIMPLE=1
    -Iinclude
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=2
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=2560
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=6
    -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=64

test_build_src = yes

lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    lvgl/lvgl@^9.2.2
    h2zero/NimBLE-Arduino@^2.2.0

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++17
    -DUNIT_TEST
    -Iinclude

